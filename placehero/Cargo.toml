[package]
name = "placehero"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["xilem/default"]

[dependencies]
reqwest = { workspace = true }
html5gum = "0.8.3"
time = { workspace = true, features = ["serde-well-known"] }
tracing.workspace = true
xilem = { workspace = true, features = ["async"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "time", "net", "sync", "io-util"] }
demo_support = { path = "../demo_support" }
anyhow = "1.0.102"
blurhash = "0.2.3"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["rc"] }

[lints]
workspace = true
