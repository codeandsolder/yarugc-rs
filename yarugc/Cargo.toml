[package]
name = "yarugc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/codeandsolder/yarugc-rs"
description = "Engine-owned retained GPU window composition for Masonry widgets"
keywords = ["gui", "wgpu", "compositor"]
categories = ["gui", "rendering"]
readme = "README.md"

[dependencies]
ab_glyph_rasterizer = "0.1.10"
skrifa = "0.44.0"
bytemuck = "1.25.0"
masonry_core.workspace = true
masonry_imaging = { workspace = true, features = ["imaging_vello"] }
wgpu.workspace = true
peniko.workspace = true

[dev-dependencies]
glyphon = "=0.12.0"
sluggrs_skylines = "=0.3.4"
vello = "=0.12.0"
wgpu = { workspace = true, features = ["vulkan", "metal", "dx12", "gles", "parking_lot"] }
wgpu-font-renderer = { git = "https://github.com/ValentinRio/wgpu-font-renderer", rev = "831beb37d2a6fc5e366d4acb6d23876df367ed44" } # v1.1.0, LF shader source
masonry = { workspace = true, features = ["testing"] }
pollster = "0.4"

[lints]
workspace = true
