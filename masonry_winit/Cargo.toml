[package]
name = "masonry_winit"
version.workspace = true # We mimic Xilem's version
description = "Data-oriented Rust UI design toolkit."
keywords = ["gui", "ui", "toolkit"]
categories = ["gui", "internationalization", "accessibility"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
# There are no platform specific docs.
default-target = "x86_64-unknown-linux-gnu"
targets = []
# rustdoc-scrape-examples tracking issue https://github.com/rust-lang/rust/issues/88791
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[features]
default = ["imaging_vello"]
imaging_vello = ["masonry_imaging/imaging_vello"]
imaging_vello_hybrid = ["masonry_imaging/imaging_vello_hybrid"]
imaging_skia = ["masonry_imaging/imaging_skia"]
diagnostics = ["dep:masonry_diagnostics"]
# Explicitly select a Tracy-enabled diagnostic subscriber and native frame markers.
tracy = ["diagnostics", "dep:tracing-tracy", "masonry_diagnostics/tracy"]

[dependencies]
masonry.workspace = true
masonry_core.workspace = true
parley = { workspace = true, features = ["system"] }
masonry_diagnostics = { workspace = true, optional = true }
winit.workspace = true
tracing = { workspace = true, features = ["default"] }
tracing-tracy = { version = "0.11.4", optional = true }
ui-events-winit.workspace = true
pollster = "0.4.0"
accesskit_winit.workspace = true
masonry_imaging = { workspace = true, default-features = false }
wgpu = { workspace = true, features = ["parking_lot"] }

# Only the native host selects platform backends. Input translation does not
# implicitly activate Winit defaults or a separate client-side title renderer.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
winit = { workspace = true, features = ["x11", "wayland", "wayland-dlopen"] }
copypasta = { version = "0.10.2", default-features = false, features = ["x11"] }
smithay-clipboard = { version = "0.7.3", default-features = false, features = ["dlopen"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
copypasta = { version = "0.10.2", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "freebsd"))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12", "vulkan", "gles"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
# Metal also integrates with CoreAnimation during macOS window resizing.
wgpu = { workspace = true, features = ["metal"] }

[lints]
workspace = true
