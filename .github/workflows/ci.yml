env:
  # Release compatibility only; routine CI uses rust-toolchain.toml.
  RUST_STABLE_VER: "1.100.0"
  RUST_MIN_VER: "1.96"
  # List of packages that can not target Wasm.
  NO_WASM_PKGS: >-
    --exclude masonry_core
    --exclude masonry_testing
    --exclude masonry
    --exclude masonry_winit
    --exclude xilem
    --exclude xilem_masonry
    --exclude placehero
    --exclude yarugc
  # Only some of our examples support Android (primarily due to extra required boilerplate).
  ANDROID_TARGETS: >-
    -p xilem
    --example mason_android
    --example calc_android
    --example stopwatch_android
    --example variable_clock_android
    --example http_cats_android
    --example to_do_mvc_android
  # Whether the workspace contains Rust code using the debug_assertions configuration option.
  USING_DEBUG_ASSERTIONS: "true"

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      cargo-args: --locked --workspace --all-targets --all-features
      apt-packages: libasound2-dev libudev-dev libfontconfig1-dev
      allow-test-panics: true

  strict-wasm:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      rust-targets: wasm32-unknown-unknown
      cargo-args: --locked --workspace --all-targets --all-features --target wasm32-unknown-unknown --exclude masonry_core --exclude masonry_testing --exclude masonry --exclude masonry_winit --exclude xilem --exclude xilem_masonry --exclude placehero --exclude yarugc
      allow-test-panics: true
      dependency-quality: false

  duplicates:
    uses: codeandsolder/ci-workflows/.github/workflows/clone-regression.yml@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

  source-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

  fmt:
    name: formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

      - name: Install resolved Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: rustfmt

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Run cargo fmt
        run: cargo fmt --all --check

      - name: Install Taplo
        uses: uncenter/setup-taplo@09968a8ae38d66ddd3d23802c44bf6122d7aa991 # v1
        with:
          version: "0.9.3"

      - name: Run taplo fmt
        run: taplo fmt --check --diff

      - name: Install ripgrep
        run: |
          sudo apt update
          sudo apt install ripgrep

      - name: Check copyright headers
        run: bash .github/copyright.sh

      - name: Check debug_assertions presence
        run: bash .github/debug_assertions.sh

      - name: Install cargo-rdme
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-rdme@1.4.8

      - name: Run cargo rdme (masonry)
        run: cargo rdme --check --workspace-project=masonry

      - name: Run cargo rdme (masonry_core)
        run: cargo rdme --check --workspace-project=masonry_core

      - name: Run cargo rdme (masonry_testing)
        run: cargo rdme --check --workspace-project=masonry_testing

      - name: Run cargo rdme (masonry_winit)
        run: cargo rdme --check --workspace-project=masonry_winit

      - name: Run cargo rdme (tree_arena)
        run: cargo rdme --check --workspace-project=tree_arena

      - name: Run cargo rdme (xilem)
        run: cargo rdme --check --workspace-project=xilem

      - name: Run cargo rdme (xilem_core)
        run: cargo rdme --check --workspace-project=xilem_core

      - name: Run cargo rdme (xilem_masonry)
        run: cargo rdme --check --workspace-project=xilem_masonry

      - name: Run cargo rdme (xilem_web)
        run: cargo rdme --check --workspace-project=xilem_web

      - name: Run cargo rdme (placehero)
        run: cargo rdme --check --workspace-project=placehero

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

  clippy-stable:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: cargo clippy
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          validation-tier: release
          rust-toolchain: ${{ env.RUST_STABLE_VER }}

      - name: Install resolved Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: clippy

      - name: Install cargo-hack
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-hack

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libfontconfig1-dev

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Run cargo clippy
        run: cargo hack clippy --workspace --locked --profile ci --optional-deps --each-feature -- -D warnings

      - name: Run cargo clippy (auxiliary)
        run: cargo hack clippy --workspace --locked --profile ci --optional-deps --each-feature --tests --benches --examples -- -D warnings

      - name: Run cargo clippy (no debug_assertions)
        if: env.USING_DEBUG_ASSERTIONS == 'true'
        run: cargo hack clippy --workspace --locked --profile ci --optional-deps --each-feature -- -D warnings
        env:
          CARGO_PROFILE_CI_DEBUG_ASSERTIONS: "false"

      - name: Run cargo clippy (auxiliary) (no debug_assertions)
        if: env.USING_DEBUG_ASSERTIONS == 'true'
        run: cargo hack clippy --workspace --locked --profile ci --optional-deps --each-feature --tests --benches --examples -- -D warnings
        env:
          CARGO_PROFILE_CI_DEBUG_ASSERTIONS: "false"

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

  clippy-stable-wasm:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: cargo clippy (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          validation-tier: release
          rust-toolchain: ${{ env.RUST_STABLE_VER }}

      - name: Install resolved Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Install cargo-hack
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-hack

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Run cargo clippy
        run: cargo hack clippy --workspace ${{ env.NO_WASM_PKGS }} --locked --profile ci --target wasm32-unknown-unknown --optional-deps --each-feature -- -D warnings

      - name: Run cargo clippy (auxiliary)
        run: cargo hack clippy --workspace ${{ env.NO_WASM_PKGS }} --locked --profile ci --target wasm32-unknown-unknown --optional-deps --each-feature --tests --benches --examples -- -D warnings

      - name: Run cargo clippy (no debug_assertions)
        if: env.USING_DEBUG_ASSERTIONS == 'true'
        run: cargo hack clippy --workspace ${{ env.NO_WASM_PKGS }} --locked --profile ci --target wasm32-unknown-unknown --optional-deps --each-feature -- -D warnings
        env:
          CARGO_PROFILE_CI_DEBUG_ASSERTIONS: "false"

      - name: Run cargo clippy (auxiliary) (no debug_assertions)
        if: env.USING_DEBUG_ASSERTIONS == 'true'
        run: cargo hack clippy --workspace ${{ env.NO_WASM_PKGS }} --locked --profile ci --target wasm32-unknown-unknown --optional-deps --each-feature --tests --benches --examples -- -D warnings
        env:
          CARGO_PROFILE_CI_DEBUG_ASSERTIONS: "false"

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

  test-native:
    name: cargo test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ startsWith(github.ref, 'refs/tags/') && fromJSON('["windows-latest","macos-latest","ubuntu-24.04"]') || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

      - name: Install resolved Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libfontconfig1-dev

      - name: Install xvfb, llvmpipe and lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libegl-mesa0 \
            libgl1-mesa-dri \
            libxcb-xfixes0-dev \
            mesa-vulkan-drivers

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-nextest

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Run cargo nextest
        run: cargo nextest run --workspace --locked --cargo-profile ci --all-features --no-fail-fast
        env:
          # We do not run the masonry render tests on platforms without a working GPU,
          # because those require Vello rendering to be working
          # See also https://github.com/linebender/vello/pull/610
          SKIP_RENDER_TESTS: ${{ runner.os == 'Windows' && '1' || '' }}
          # Check that doc file paths are correct
          CHECK_DOC_PATHS: "true"

      - name: Run cargo nextest on unsafe arena
        run: cargo nextest run -p tree_arena --locked --no-fail-fast --no-default-features

      - name: Upload test results due to failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: masonry-snapshot-tests-${{ matrix.os }}
          path: '**/screenshots/*.png'

      - name: Run cargo test --doc
        run: cargo test --doc --workspace --locked --profile ci --all-features --no-fail-fast

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

  miri:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: cargo miri (unsafe tree_arena)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

      - name: Install resolved Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: miri

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Run cargo miri
        run: cargo miri test -p tree_arena --locked --no-default-features --no-fail-fast

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

  test-wasm:
    name: cargo test (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

      - name: Install resolved Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          targets: wasm32-unknown-unknown

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      # TODO: Find a way to make tests work. Until then the tests are merely compiled.
      - name: Run cargo test --no-run
        run: cargo test --workspace ${{ env.NO_WASM_PKGS }} --locked --profile ci --target wasm32-unknown-unknown --all-features --no-run

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

  check-stable-android:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: cargo check (aarch64-android)
    env:
      RUSTFLAGS: '-D warnings'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          validation-tier: release
          rust-toolchain: ${{ env.RUST_STABLE_VER }}

      - name: Install resolved Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          targets: aarch64-linux-android

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Run cargo apk check
        run: cargo apk check ${{ env.ANDROID_TARGETS }}

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

  check-msrv:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: cargo check (msrv)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          validation-tier: release
          rust-toolchain: ${{ env.RUST_MIN_VER }}

      - name: Install resolved Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Install cargo-hack
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-hack

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libfontconfig1-dev

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Run cargo check
        run: cargo hack check --workspace --ignore-private --locked --profile ci --optional-deps --each-feature

      - name: Run cargo check (no debug_assertions)
        if: env.USING_DEBUG_ASSERTIONS == 'true'
        run: cargo hack check --workspace --ignore-private --locked --profile ci --optional-deps --each-feature
        env:
          CARGO_PROFILE_CI_DEBUG_ASSERTIONS: "false"

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

  check-msrv-wasm:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: cargo check (msrv) (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          validation-tier: release
          rust-toolchain: ${{ env.RUST_MIN_VER }}

      - name: Install resolved Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          targets: wasm32-unknown-unknown

      - name: Install cargo-hack
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-hack

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Run cargo check
        run: cargo hack check --workspace --ignore-private ${{ env.NO_WASM_PKGS }} --locked --profile ci --target wasm32-unknown-unknown --optional-deps --each-feature

      - name: Run cargo check (no debug_assertions)
        if: env.USING_DEBUG_ASSERTIONS == 'true'
        run: cargo hack check --workspace --ignore-private ${{ env.NO_WASM_PKGS }} --locked --profile ci --target wasm32-unknown-unknown --optional-deps --each-feature
        env:
          CARGO_PROFILE_CI_DEBUG_ASSERTIONS: "false"

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

  doc:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: cargo doc
    # NOTE: We don't have any platform specific docs in this workspace, so we only run on Ubuntu.
    #       If we get per-platform docs (win/macos/linux/wasm32/..) then doc jobs should match that.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

      - name: Install resolved Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libfontconfig1-dev

      # We test documentation using nightly to match docs.rs.
      - name: Run cargo doc
        run: cargo doc --workspace --locked --profile ci --all-features --no-deps --document-private-items -Zunstable-options -Zrustdoc-scrape-examples
        env:
          RUSTDOCFLAGS: '--cfg docsrs -D warnings'

      - name: Run cargo doc on unsafe arena
        run: cargo doc -p tree_arena --locked --profile ci --no-default-features --document-private-items -Zunstable-options -Zrustdoc-scrape-examples
        env:
          RUSTDOCFLAGS: '--cfg docsrs -D warnings'

  # If this fails, consider changing your text or adding something to .typos.toml.

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@83ceff49d93d152cd95a1c9d6addb5cf03169477 # main

  typos:
    runs-on: ubuntu-24.04
